(function () {

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;

    for (var i = scope.length - 1; i >= 0; i--) {
      if (Object.prototype.hasOwnProperty.call(scope[i], parts[0])) { cur = scope[i][parts[0]]; break; }
    }
    for (var j = 1; j < parts.length && cur != null; j++) cur = cur[parts[j]];
    return cur;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }

  function build(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(interp(node.nodeValue, scope)));
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var m = WHOLE.exec(node.getAttribute('list') || '');
      var list = m ? lookup(m[1], scope) : null;
      var as = node.getAttribute('as') || 'item';
      (list || []).forEach(function (item, idx) {
        var s = {}; s[as] = item; s.$index = idx;
        var next = scope.concat([s]);
        node.childNodes.forEach(function (c) { build(c, next, out); });

    }
    if (tag === 'sc-if') {
      var mv = WHOLE.exec(node.getAttribute('value') || '');
      if (mv && lookup(mv[1], scope)) node.childNodes.forEach(function (c) { build(c, scope, out); });
      return;
    }
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, node.tagName)

      var at = node.attributes[a], name = at.name, val = at.value;

      }
      el.setAttribute(name, val.indexOf('{{') >= 0 ? interp(val, scope) : val);

      var href = el.getAttribute('href') || '';

  window.mountPage = function (Component, props) {
    var tpl = document.getElementById('tpl');
    var root = document.getElementById('app');
    var comp = new Component(props);

      tpl.content.childNodes.forEach(function (c) { build(c, [vals], frag); });
